name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --no-audit
        env:
          npm_config_loglevel: warn

      - name: Run linter
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Verify dist files
        run: |
          test -f dist/extension.js || { echo "Missing dist/extension.js"; exit 1; }
          test -f dist/types.js || { echo "Missing dist/types.js"; exit 1; }
          echo "✓ All dist files verified"

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --no-audit
        env:
          npm_config_loglevel: warn

      - name: Run security audit
        run: npm audit --audit-level=critical || echo "::warning::Security vulnerabilities found - review npm audit output"

  package:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: [build, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --no-audit
        env:
          npm_config_loglevel: warn

      - name: Package extension
        run: npm run package

      - name: Verify VSIX created
        run: |
          ls -la *.vsix
          echo "✓ Extension packaged successfully"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeflow-vsix
          path: "*.vsix"
          retention-days: 30
